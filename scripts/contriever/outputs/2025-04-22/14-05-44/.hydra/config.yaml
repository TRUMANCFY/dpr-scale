task:
  _target_: dpr_scale.task.dpr_task.DensePropRetrieverTask
  shared_model: true
  in_batch_eval: false
  datamodule: null
  warmup_steps: 100000
  pretrained_checkpoint_path: null
  model:
    _target_: dpr_scale.models.hf_model.HFEncoder
    model_path: facebook/contriever
    projection_dim: null
    dropout: 0.1
  transform:
    _target_: dpr_scale.transforms.hf_transform.HFTransform
    model_path: ${task.model.model_path}
    max_seq_len: 256
  optim:
    _target_: torch.optim.AdamW
    lr: 1.0e-05
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0
    amsgrad: false
datamodule:
  _target_: dpr_scale.datamodule.dpr.DenseRetrieverPropMultiJsonlDataModule
  train_path:
  - /pfss/mlde/workspaces/mlde_wsp_PI_Heinz/cai/mixgr_training/data/official.query.jsonl
  val_path: /pfss/mlde/workspaces/mlde_wsp_PI_Heinz/cai/mixgr_training/data/official.dev.query.jsonl
  test_path: /pfss/mlde/workspaces/mlde_wsp_PI_Heinz/cai/mixgr_training/data/official.dev.query.jsonl
  batch_size: 4
  num_negative: 7
  num_val_negative: 10
  drop_last: false
  use_title: false
  corpus_path: /pfss/mlde/workspaces/mlde_wsp_PI_Heinz/cai/mixgr_training/data/collection.tsv
  pos_ctx_sample: false
  num_test_negative: 50
trainer:
  gpus: 4
  max_steps: null
  max_epochs: 20
  num_nodes: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  precision: 16
  strategy: ddp
test_only: false
checkpoint_callback:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  dirpath: /pfss/mlde/workspaces/mlde_wsp_PI_Heinz/cai/dpr-scale/models/contriever.prop.msmarco.ep10.bs64.neg7.max_length512.lr1e-5/checkpoints
  monitor: valid_mrr
  mode: max
  save_last: true
  verbose: true
  filename: checkpoint_best
  save_top_k: 3
logger:
  project: contriever-msmarco-prop
  name: /pfss/mlde/workspaces/mlde_wsp_PI_Heinz/cai/dpr-scale/logs/contriever.prop.msmarco.ep20.bs16.neg7.max_length512.lr1e-5
